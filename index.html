<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hungry Bag</title>
<script src="https://yandex.ru/games/sdk/v2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#stage{
  width:100vw;height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
#gc{
  width:360px;height:640px;position:relative;overflow:hidden;
  border-radius:16px;border:3px solid #222;
  image-rendering:pixelated;cursor:none;
  transform-origin:center center;flex-shrink:0;
}
#cv{display:block;width:360px;height:640px;image-rendering:pixelated}
#overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:13px;
}
#oBox{
  background:#1a1a2e;border:3px solid #FFD700;border-radius:4px;
  padding:26px 24px;text-align:center;width:280px;max-height:560px;overflow-y:auto;
}
#oEmoji{font-size:44px;margin-bottom:8px;display:block}
#oTitle{font-size:18px;font-weight:800;color:#FFD700;margin-bottom:6px;font-family:monospace;letter-spacing:1px}
#oSub{font-size:12px;color:#aaa;line-height:1.7;margin-bottom:16px;font-family:monospace}
#oBtn{
  background:#DA291C;color:#fff;border:3px solid #ff6b6b;border-radius:2px;
  padding:11px 0;font-size:14px;font-weight:800;cursor:pointer;width:100%;
  font-family:monospace;letter-spacing:2px;
}
#oBtn:active{transform:scale(0.97)}
#hintRow{font-size:10px;color:#888;margin-top:14px;line-height:1.6;font-family:monospace}
#hud{
  position:absolute;top:0;left:0;right:0;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;font-family:monospace;
  z-index:2;
}
.hpill{
  background:rgba(0,0,0,0.65);border:2px solid rgba(255,255,255,0.2);
  border-radius:2px;padding:4px 10px;font-size:13px;font-weight:800;color:#FFD700;
  letter-spacing:1px;
}
#pauseBtn{
  pointer-events:auto;cursor:pointer;
  background:rgba(0,0,0,0.65);border:2px solid rgba(255,255,255,0.2);
  border-radius:2px;padding:4px 9px;font-size:13px;color:#FFD700;
  font-family:monospace;
}
#pauseBtn:active{transform:scale(0.94)}
#lvlBanner{
  position:absolute;top:54px;left:50%;transform:translateX(-50%);
  font-family:monospace;font-size:13px;font-weight:800;color:#fff;
  background:rgba(0,0,0,0.75);border:2px solid #FFD700;border-radius:2px;
  padding:4px 14px;pointer-events:none;opacity:0;transition:opacity 0.3s;
  white-space:nowrap;letter-spacing:1px;z-index:2;
}
#floatCont{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
  z-index:1;
}
#hearts{display:flex;gap:4px}

.ovl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:13px;background:rgba(0,0,0,0.5);z-index:5;}
.obox{background:#1a1a2e;border:3px solid #FFD700;border-radius:4px;padding:24px 22px;text-align:center;width:230px;max-height:520px;overflow-y:auto;font-family:monospace;}
.obtn{background:#DA291C;color:#fff;border:3px solid #ff6b6b;border-radius:2px;padding:10px 0;font-size:13px;font-weight:800;cursor:pointer;width:100%;font-family:monospace;letter-spacing:1px;margin-top:10px;}
.obtn:active:not(:disabled){transform:scale(0.97)}
.obtn:disabled{opacity:0.4;cursor:default}
.obtnAlt{background:#12283f;color:#8ecfff;border:3px solid #4aaccc;border-radius:2px;padding:9px 0;font-size:12px;font-weight:800;cursor:pointer;width:100%;font-family:monospace;letter-spacing:1px;margin-top:10px;}
.obtnAlt:active:not(:disabled){transform:scale(0.97)}
.obtnAlt:disabled{opacity:0.4;cursor:default}
.obtnGhost{background:transparent;color:#999;border:2px solid #444;border-radius:2px;padding:8px 0;font-size:11px;cursor:pointer;width:100%;font-family:monospace;margin-top:8px;}
#lbList{font-size:12px;color:#ddd;text-align:left;line-height:1.9;min-height:20px;margin-top:4px}
</style>
</head>
<body>

<div id="stage">
<div id="gc">
  <canvas id="cv" width="360" height="640"></canvas>
  <div id="hud">
    <span class="hpill" id="scoreEl">00000</span>
    <div id="hearts"></div>
    <span id="pauseBtn">⏸</span>
    <span class="hpill" id="lvlEl">LV1</span>
  </div>
  <div id="lvlBanner"></div>
  <div id="floatCont"></div>

  <div id="overlay">
    <div id="oBox">
      <span id="oEmoji">🛍️</span>
      <div id="oTitle">HUNGRY BAG</div>
      <div id="oSub">Лови еду в пакет!<br>3 жизни · тухляк = -1 ❤️<br>⭐ звезда даёт щит<br>Каждые 150 очков — FRENZY x2!</div>
      <button id="oBtn">► ИГРАТЬ</button>
      <button id="lbBtn" class="obtnAlt">🏆 Таблица лидеров</button>
      <div id="hintRow">⬅➡ / A D — движение<br>Space / P / Esc — пауза</div>
    </div>
  </div>

  <div id="pauseOverlay" class="ovl">
    <div class="obox">
      <span style="font-size:38px;display:block;margin-bottom:6px">⏸</span>
      <div style="font-size:17px;font-weight:800;color:#FFD700;letter-spacing:1px">ПАУЗА</div>
      <button id="resumeBtn" class="obtn">► ПРОДОЛЖИТЬ</button>
      <button id="adShieldBtn" class="obtnAlt">🛡️ Щит 10 сек — за рекламу</button>
      <button id="muteBtn" class="obtnGhost">🔊 Звук: Вкл</button>
    </div>
  </div>

  <div id="reviveOverlay" class="ovl">
    <div class="obox">
      <span style="font-size:38px;display:block;margin-bottom:6px">💔</span>
      <div style="font-size:15px;font-weight:800;color:#FFD700;margin-bottom:6px">ЖИЗНИ КОНЧИЛИСЬ</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:6px">Посмотри рекламу — вернём 1 ❤️ и доиграешь</div>
      <button id="reviveBtn" class="obtn">🎬 Смотреть рекламу</button>
      <button id="declineBtn" class="obtnGhost">✖ Закончить игру</button>
    </div>
  </div>

  <div id="lbOverlay" class="ovl">
    <div class="obox">
      <div style="font-size:15px;font-weight:800;color:#FFD700;margin-bottom:4px">🏆 ТОП ИГРОКОВ</div>
      <div id="lbList">Загрузка...</div>
      <button id="lbCloseBtn" class="obtnGhost">✖ Закрыть</button>
    </div>
  </div>

</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=360,H=640,PX=4;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ac=null;
function initAudio(){if(!ac){ac=new AudioCtx();}}
function tone(f,d,v=0.15,t='square'){
  if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.frequency.value=f;o.type=t;
  g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.start();o.stop(ac.currentTime+d);}catch(e){}
}
function sndCollect(pts){tone(300+pts*6,0.08,0.12,'square');setTimeout(()=>tone(500+pts*8,0.07,0.09,'square'),50)}
function sndBad(){tone(120,0.06,0.2,'sawtooth');setTimeout(()=>tone(80,0.12,0.18,'sawtooth'),60);}
function sndDie(){[200,160,120,80].forEach((f,i)=>setTimeout(()=>tone(f,0.15,0.2,'sawtooth'),i*80));}
function sndLvl(){[400,500,600,800,1000].forEach((f,i)=>setTimeout(()=>tone(f,0.1,0.15,'square'),i*55));}
function sndFull(){[500,600,700,900].forEach((f,i)=>setTimeout(()=>tone(f,0.1,0.18,'sine'),i*60));}
function sndCola(){tone(700,0.06,0.15,'square');setTimeout(()=>tone(900,0.06,0.12,'square'),60);}
function sndIce(){tone(350,0.12,0.12,'triangle');setTimeout(()=>tone(250,0.1,0.1,'triangle'),90);}

// --- фоновая музыка (процедурная, без внешних файлов) ---
let musicOn=true,musicTimer=null,musicStep=0;
const MUSIC_NOTES=[220,0,262,0,294,0,262,220,0,196,0,220,262,0,294,0];
function musicTick(){
  if(!musicOn||state!=='playing')return;
  const n=MUSIC_NOTES[musicStep%MUSIC_NOTES.length];
  if(n)tone(n,0.16,0.04,'triangle');
  musicStep++;
}
function startMusic(){stopMusic();musicStep=0;musicTimer=setInterval(musicTick,180);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}

const LEVELS=[
  {name:'УТРО',   bg:'#241d4a', ground:'#3d2b1f', groundTop:'#c8a870', speed:2.2, label:'☀️ УТРО — проснулись!'},
  {name:'ОБЕД',   bg:'#173d2a', ground:'#2d1f0a', groundTop:'#8B6914', speed:3.2, label:'🌤️ ОБЕД — навалило!'},
  {name:'ВЕЧЕР',  bg:'#4a1414', ground:'#1a0a05', groundTop:'#6b3a1f', speed:4.6, label:'🌙 ВЕЧЕР — хаос!'},
  {name:'НОЧЬ',   bg:'#04040d', ground:'#0a0505', groundTop:'#3a2a10', speed:6.2, label:'👾 НОЧЬ — безумие!!!'},
];

function getLvl(score){return Math.min(3,Math.floor(score/100));}

const ITEMS_BY_LEVEL=[
  [{e:'🍔',pts:10,w:46,type:'food',lbl:'+10'},{e:'🍟',pts:5,w:40,type:'food',lbl:'+5'},{e:'🥤',pts:5,w:40,type:'cola',lbl:'⚡'},{e:'🍎',pts:15,w:42,type:'food',lbl:'+15'},{e:'🤢',pts:0,w:44,type:'bad',lbl:'💀 -1❤️'}],
  [{e:'🍔',pts:10,w:46,type:'food',lbl:'+10'},{e:'🍟',pts:5,w:40,type:'food',lbl:'+5'},{e:'🥤',pts:5,w:40,type:'cola',lbl:'⚡'},{e:'🍦',pts:8,w:42,type:'ice',lbl:'❄️'},{e:'🍎',pts:15,w:42,type:'food',lbl:'+15'},{e:'🤢',pts:0,w:44,type:'bad',lbl:'💀 -1❤️'},{e:'🦠',pts:0,w:42,type:'bad',lbl:'💀 -1❤️'}],
  [{e:'🍔',pts:10,w:46,type:'food',lbl:'+10'},{e:'⭐',pts:25,w:44,type:'star',lbl:'+25!'},{e:'🥤',pts:5,w:40,type:'cola',lbl:'⚡'},{e:'🍦',pts:8,w:42,type:'ice',lbl:'❄️'},{e:'🍎',pts:15,w:42,type:'food',lbl:'+15'},{e:'🤢',pts:0,w:44,type:'bad',lbl:'💀 -1❤️'},{e:'🦠',pts:0,w:42,type:'bad',lbl:'💀 -1❤️'},{e:'💩',pts:0,w:42,type:'bad',lbl:'💀 -1❤️'}],
  [{e:'🍔',pts:15,w:46,type:'food',lbl:'+15'},{e:'⭐',pts:30,w:44,type:'star',lbl:'+30!'},{e:'🍦',pts:10,w:42,type:'ice',lbl:'❄️'},{e:'🍎',pts:18,w:42,type:'food',lbl:'+18'},{e:'🤢',pts:0,w:44,type:'bad',lbl:'💀'},{e:'🦠',pts:0,w:42,type:'bad',lbl:'💀'},{e:'💩',pts:0,w:42,type:'bad',lbl:'💀'},{e:'🗑️',pts:0,w:42,type:'bad',lbl:'💀'}],
];
const WEIGHTS_BY_LEVEL=[
  [22,18,11,12,16],
  [20,16,10,8,10,16,8],
  [16,8,9,8,10,17,11,9],
  [14,9,9,8,21,17,13,11],
];

function weightedRoll(pool,wts){
  let r=Math.random()*wts.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=wts[i];if(r<=0)return pool[i];}
  return pool[0];
}
let lastItems=[];
function pickItem(lvl){
  const pool=ITEMS_BY_LEVEL[lvl],wts=WEIGHTS_BY_LEVEL[lvl];
  let picked=weightedRoll(pool,wts);
  let tries=0;
  // не даём одному и тому же предмету выпадать много раз подряд
  while(lastItems.includes(picked.e)&&tries<6){
    picked=weightedRoll(pool,wts);
    tries++;
  }
  lastItems.push(picked.e);
  if(lastItems.length>2)lastItems.shift();
  return picked;
}

const FLOOR=H-44;
const BW=56,BH=70,BAG_Y=FLOOR-BH;

let state='idle',score=0,hi=0,lives=3,bagX=W/2-BW/2,targetX=W/2-BW/2;
let items=[],particles=[],frame=0,spawnT=0;
let slowMo=0,fastMo=0,shakeX=0,shakeY=0,bagFill=0;
let curLvl=0,combo=0,comboTimer=0;
let animId,hitFlash=0;
let keyLeft=false,keyRight=false;
const KEY_SPEED=7;
let shieldTime=0;
let frenzyTime=0,nextFrenzyScore=150;
let reviveUsed=false;
let unlockedAch=[];

const ITEM_BG={
  food:'rgba(255,240,180,0.92)',
  cola:'rgba(180,230,255,0.92)',
  ice:'rgba(200,240,255,0.92)',
  star:'rgba(255,255,180,0.95)',
  bad:'rgba(255,180,180,0.92)',
};
const ITEM_BORDER={
  food:'#c8960a',
  cola:'#1a7ab5',
  ice:'#4aaccc',
  star:'#cc8800',
  bad:'#cc1a1a',
};

const itemSpriteCache={};
function getItemSprite(e,w){
  const key=e+'_'+w;
  if(itemSpriteCache[key])return itemSpriteCache[key];
  const size=w+2,pad=8;
  const off=document.createElement('canvas');
  off.width=size+pad;off.height=size+pad;
  const octx=off.getContext('2d');
  octx.font=`${size}px serif`;
  octx.textAlign='center';octx.textBaseline='middle';
  octx.fillText(e,off.width/2,off.height/2+1);

  const img=octx.getImageData(0,0,off.width,off.height);
  const d=img.data;
  const factor=1.55;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0)continue;
    const r=d[i],g=d[i+1],b=d[i+2];
    const l=(Math.max(r,g,b)+Math.min(r,g,b))/2;
    d[i]=Math.min(255,Math.max(0,l+(r-l)*factor));
    d[i+1]=Math.min(255,Math.max(0,l+(g-l)*factor));
    d[i+2]=Math.min(255,Math.max(0,l+(b-l)*factor));
  }
  octx.putImageData(img,0,0);
  itemSpriteCache[key]=off;
  return off;
}
function drawPixelItem(it){
  const {e,x,y,w}=it;
  const sprite=getItemSprite(e,w);
  ctx.drawImage(sprite,x-sprite.width/2,y-sprite.height/2+1);
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);
  c.closePath();
}

// --- пакет (общий дизайн, без сторонних логотипов) ---
function drawPixelBag(cx,cy,fill,emotion){
  const x=cx-BW/2,y=cy;
  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(4,BH-4,BW-2,7);

  ctx.fillStyle='#c8955a';
  ctx.fillRect(2,4,BW-4,BH-8);

  ctx.fillStyle='rgba(0,0,0,0.1)';
  for(let i=0;i<3;i++) ctx.fillRect(8+i*14,4,2,BH-14);

  ctx.fillStyle='#a87040';
  ctx.fillRect(4,BH-14,BW-8,10);

  ctx.fillStyle='#8a5c30';
  ctx.fillRect(BW-8,4,6,BH-14);

  if(fill>0){
    const fh=Math.floor((BH-20)*(fill/10));
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(4,BH-14-fh,4,fh);
  }

  // (значок с пакета убран по запросу)

  ctx.fillStyle='#a87040';
  ctx.fillRect(4,2,BW-8,4);
  ctx.fillStyle='#c8955a';
  for(let i=0;i<5;i++) ctx.fillRect(6+i*(BW-12)/5,0,4,4);

  ctx.fillStyle='#a87040';
  ctx.fillRect(10,0,6,6);ctx.fillRect(BW-16,0,6,6);

  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.fillRect(6,6,10,BH-20);

  if(slowMo>0){ctx.fillStyle='rgba(100,180,255,0.15)';ctx.fillRect(0,0,BW,BH);}
  if(fastMo>0){ctx.fillStyle='rgba(255,100,30,0.15)';ctx.fillRect(0,0,BW,BH);}
  if(shieldTime>0){
    ctx.strokeStyle=`rgba(80,220,255,${0.5+0.5*Math.sin(frame*0.3)})`;
    ctx.lineWidth=3;
    ctx.strokeRect(-2,-2,BW+4,BH+4);
  }

  ctx.font='13px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emotion||'😐',BW/2,13);

  ctx.restore();
}

// --- фон: статичная картинка города, своя на каждый уровень ---
function genBuildings(seed,count){
  const arr=[];
  for(let i=0;i<count;i++){
    arr.push({w:26+((seed+i*31)%22),h:40+((seed+i*53)%90),lit:(seed+i*17)%100});
  }
  return arr;
}
const SKYLINES=[genBuildings(11,11),genBuildings(37,16),genBuildings(59,13),genBuildings(83,18)];
const SKY_COLORS=[
  {far:'#332b5c',near:'#22194a',win:'rgba(255,220,140,0.45)'},
  {far:'#1c4a2c',near:'#123018',win:'rgba(255,255,200,0.4)'},
  {far:'#5c1e1e',near:'#3a1010',win:'rgba(255,180,120,0.55)'},
  {far:'#0a0a1c',near:'#050510',win:'rgba(150,220,255,0.85)'},
];
function drawRow(bl,color,baseY,heightMul,winColor,winAlphaMul){
  let x=0;
  while(x<W){
    bl.forEach(b=>{
      const h=b.h*heightMul;
      if(x<W){
        ctx.fillStyle=color;
        ctx.fillRect(x,baseY-h,b.w,h);
        for(let wy=6;wy<h-6;wy+=12){
          for(let wx=4;wx<b.w-4;wx+=10){
            if((b.lit+wx+wy)%3===0){
              ctx.globalAlpha=winAlphaMul*(0.55+0.45*((b.lit%7)/7));
              ctx.fillStyle=winColor;
              ctx.fillRect(x+wx,baseY-h+wy,3,4);
              ctx.globalAlpha=1;
            }
          }
        }
      }
      x+=b.w;
    });
  }
}
function drawSkyline(lvl){
  const bl=SKYLINES[lvl],col=SKY_COLORS[lvl];
  const baseY=FLOOR-2;
  drawRow(bl,col.far,baseY-14,0.55,col.win,0.5);
  drawRow(bl,col.near,baseY,0.85,col.win,1);
}

function drawBg(lvl){
  const lv=LEVELS[lvl];
  const g=ctx.createLinearGradient(0,0,0,FLOOR);
  g.addColorStop(0,lv.bg);g.addColorStop(1,lv.ground);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(lvl===3){
    for(let i=0;i<30;i++){
      const sx=(i*139+71)%W,sy=(i*83+29)%(H*0.55);
      const tw=0.2+0.8*Math.abs(Math.sin(frame*0.04+i*1.1));
      ctx.fillStyle=`rgba(255,255,255,${tw*0.8})`;
      ctx.fillRect(sx,sy,i%4===0?2:1,i%4===0?2:1);
    }
  } else {
    const cx1=(frame*0.3)%(W+160)-80,cx2=(frame*0.2+200)%(W+160)-80;
    drawCloud(cx1,50);drawCloud(cx2,80);
  }

  drawSkyline(lvl);

  ctx.fillStyle=lv.ground;ctx.fillRect(0,FLOOR+4,W,H-FLOOR);
  ctx.fillStyle=lv.groundTop;ctx.fillRect(0,FLOOR,W,5);
  for(let x=((frame*1.2)|0)%24-24;x<W;x+=24){
    ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(x,FLOOR+1,12,2);
  }
  for(let x=((frame*2.5)|0)%40-40;x<W;x+=40){
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(x,FLOOR+20,20,3);
  }
}

function drawCloud(x,y){
  ctx.fillStyle='rgba(255,255,255,0.06)';
  [[0,8,16,8],[12,0,20,16],[28,4,16,12],[40,8,12,8]].forEach(([bx,by,bw,bh])=>ctx.fillRect(x+bx,y+by,bw,bh));
}

function getBagEmo(){
  if(shieldTime>0)return'🛡️';
  if(slowMo>0)return'😴';if(fastMo>0)return'🤩';
  if(lives===1)return'😰';if(bagFill>=8)return'😍';
  if(bagFill>=5)return'😊';if(combo>=3)return'🔥';return'😐';
}

function updateHUD(){
  document.getElementById('scoreEl').textContent=String(score).padStart(5,'0');
  document.getElementById('lvlEl').textContent='LV'+(curLvl+1);
  const hc=document.getElementById('hearts');
  hc.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.style.cssText='font-size:16px;line-height:1';
    s.textContent=i<lives?'❤️':'🖤';
    hc.appendChild(s);
  }
}

function drawCanvasHUD(){
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(W-18,H/2-58,12,116);
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(W-17,H/2-57,10,114);
  if(bagFill>0){
    const fh=112*(bagFill/10);
    ctx.fillStyle=bagFill>=8?'#FFD700':'#DA291C';
    ctx.fillRect(W-17,H/2-57+112-fh,10,fh);
  }
  ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('BAG',W-12,H/2+68);

  if(combo>=2){
    ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#FFD700';
    ctx.fillText(combo+'x COMBO',W/2,H-62);
  }

  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(W/2-60,H-16,120,4);
  const spFrac=Math.min(1,(LEVELS[curLvl].speed-2)/5);
  ctx.fillStyle='#DA291C';ctx.fillRect(W/2-60,H-16,120*spFrac,4);
}

function addParticles(x,y,good,n=12){
  const cols=good?['#FFD700','#FF9900','#fff','#ffee55']:['#e55','#f99','#fff'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,alpha:1,color:cols[i%cols.length],size:PX+Math.floor(Math.random()*PX*2)});
  }
}

function addFloat(text,x,y,color='#FFD700'){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${x}px;top:${y}px;transform:translateX(-50%);font-size:14px;font-weight:800;color:${color};font-family:monospace;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,0.9);pointer-events:none;white-space:nowrap;transition:transform 0.65s ease-out,opacity 0.65s ease-out`;
  el.textContent=text;
  document.getElementById('floatCont').appendChild(el);
  requestAnimationFrame(()=>{el.style.transform='translateX(-50%) translateY(-44px)';el.style.opacity='0';});
  setTimeout(()=>el.remove(),700);
}

function showLvlBanner(txt){
  const el=document.getElementById('lvlBanner');
  el.textContent=txt;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1800);
}

function spawnItem(){
  const lvl=getLvl(score);
  const lv=LEVELS[lvl];
  const effectSpeed=lv.speed*(slowMo>0?0.4:fastMo>0?1.8:1);
  const it=pickItem(lvl);
  items.push({...it,x:it.w/2+16+Math.random()*(W-it.w-32),y:-50,vy:effectSpeed+Math.random()*0.6,wobble:Math.random()*Math.PI*2,age:0});
}

function doHitBad(){
  if(shieldTime>0){
    shakeX=6;shakeY=3;
    tone(600,0.06,0.12,'sine');
    addFloat('🛡️ БЛОК!',W/2,BAG_Y-10,'#66ccff');
    addParticles(bagX+BW/2,BAG_Y+BH/2,true,10);
    return;
  }
  lives--;updateHUD();
  shakeX=14;shakeY=8;hitFlash=22;
  sndBad();
  addFloat('💀 -1❤️',W/2,BAG_Y-10,'#ff4444');
  addParticles(bagX+BW/2,BAG_Y+BH/2,false,18);
  if(lives<=0){
    if(!reviveUsed)setTimeout(showReviveOffer,350);
    else setTimeout(endGame,350);
  }
}

function gameLoop(){
  if(state!=='playing')return;
  frame++;spawnT++;

  if(slowMo>0)slowMo--;if(fastMo>0)fastMo--;
  if(shieldTime>0){shieldTime--;if(shieldTime===0)document.getElementById('adShieldBtn').disabled=false;}
  if(frenzyTime>0)frenzyTime--;
  if(shakeX>0.5)shakeX*=0.75;else shakeX=0;
  if(shakeY>0.5)shakeY*=0.75;else shakeY=0;
  if(hitFlash>0)hitFlash--;
  if(comboTimer>0){comboTimer--;if(comboTimer===0)combo=0;}

  const newLvl=getLvl(score);
  if(newLvl!==curLvl){curLvl=newLvl;sndLvl();showLvlBanner(LEVELS[curLvl].label);}

  if(frenzyTime<=0&&score>=nextFrenzyScore){
    frenzyTime=300;
    while(nextFrenzyScore<=score)nextFrenzyScore+=150;
    sndLvl();
    showLvlBanner('🔥 FRENZY! x2 очков!');
  }

  let interval=Math.max(34,68-curLvl*8-Math.floor((score-curLvl*100)/40));
  if(frenzyTime>0)interval=Math.max(20,Math.floor(interval*0.55));
  if(spawnT>=interval){spawnItem();spawnT=0;}

  if(keyLeft)targetX-=KEY_SPEED;
  if(keyRight)targetX+=KEY_SPEED;
  targetX=Math.max(0,Math.min(W-BW,targetX));

  bagX+=(targetX-bagX)*0.15;
  bagX=Math.max(0,Math.min(W-BW,bagX));

  const lv=LEVELS[curLvl];
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    const spd=lv.speed*(slowMo>0?0.4:fastMo>0?1.8:1);
    it.y+=spd+it.vy*0.12;
    it.x+=Math.sin(frame*0.04+it.wobble)*0.5;
    it.age++;
    if(it.y>H+60){items.splice(i,1);continue;}

    const bx=bagX+6,by=BAG_Y+16,bw=BW-12,bh=BH-16,hw=it.w*0.36;
    if(it.x-hw<bx+bw&&it.x+hw>bx&&it.y-hw<by+bh&&it.y+hw>by){
      items.splice(i,1);
      if(it.type==='bad'){
        doHitBad();
      } else {
        combo++;comboTimer=220;
        const mul=combo>=5?3:combo>=3?2:1;
        if(mul===3){shakeX=Math.max(shakeX,7);shakeY=Math.max(shakeY,4);}
        let earned=(it.pts||10)*mul;
        if(frenzyTime>0)earned*=2;
        score+=earned;
        bagFill=Math.min(10,bagFill+1);
        addParticles(it.x,it.y,true,combo>=3?18:10);
        const lbl=mul>1?`${it.lbl} x${mul}!`:it.lbl;
        addFloat(lbl,it.x,BAG_Y,'#FFD700');
        if(it.type==='cola'){fastMo=130;sndCola();addFloat('⚡ БЫСТРЕЕ!',W/2,220,'#FF9900');}
        if(it.type==='ice'){slowMo=220;sndIce();addFloat('❄️ СЛОУМО',W/2,220,'#88ccff');}
        if(it.type==='star'){shieldTime=Math.max(shieldTime,180);document.getElementById('adShieldBtn').disabled=true;addFloat('🛡️ ЗАЩИТА!',W/2,220,'#ffe680');}
        if(bagFill>=10){bagFill=0;const bonus=frenzyTime>0?120:60;score+=bonus;sndFull();addFloat('🎉 +'+bonus+' ПОЛНЫЙ!',W/2,190,'#FFD700');addParticles(bagX+BW/2,BAG_Y,true,28);}
        else sndCollect(it.pts||10);
        document.getElementById('scoreEl').textContent=String(score).padStart(5,'0');
      }
    }
  }

  particles=particles.filter(p=>p.alpha>0.04);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.alpha-=0.04;});

  drawBg(curLvl);

  ctx.save();
  particles.forEach(p=>{
    ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;ctx.restore();

  items.forEach(it=>drawPixelItem(it));

  ctx.save();
  if(shakeX||shakeY)ctx.translate((Math.random()-0.5)*shakeX*2,(Math.random()-0.5)*shakeY*2);
  drawPixelBag(bagX+BW/2,BAG_Y,bagFill,getBagEmo());
  ctx.restore();

  if(hitFlash>0){ctx.fillStyle=`rgba(255,0,0,${hitFlash/22*0.38})`;ctx.fillRect(0,0,W,H);}
  if(frenzyTime>0){
    ctx.strokeStyle=`rgba(255,90,0,${0.35+0.3*Math.sin(frame*0.3)})`;
    ctx.lineWidth=8;
    ctx.strokeRect(4,4,W-8,H-8);
  }

  drawCanvasHUD();

  animId=requestAnimationFrame(gameLoop);
}

function startGame(){
  initAudio();cancelAnimationFrame(animId);
  state='playing';score=0;lives=3;bagFill=0;frame=0;spawnT=0;
  combo=0;comboTimer=0;slowMo=0;fastMo=0;shakeX=0;shakeY=0;hitFlash=0;
  items=[];particles=[];curLvl=0;
  bagX=W/2-BW/2;targetX=bagX;
  keyLeft=false;keyRight=false;
  shieldTime=0;reviveUsed=false;
  frenzyTime=0;nextFrenzyScore=150;
  lastItems=[];
  document.getElementById('adShieldBtn').disabled=false;
  updateHUD();
  document.getElementById('overlay').style.display='none';
  gameLoop();
  startMusic();
  ysdk?.features?.GameplayAPI?.start();
}

// --- достижения (через Player Data) ---
const ACHIEVEMENTS=[
  {id:'first',name:'Первая игра',cond:()=>true},
  {id:'score300',name:'300 очков за раунд',cond:()=>score>=300},
  {id:'score1000',name:'1000 очков за раунд',cond:()=>score>=1000},
  {id:'flawless',name:'Раунд без потерь (100+)',cond:()=>lives===3&&score>=100},
];
function checkAchievements(){
  const newly=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!unlockedAch.includes(a.id)&&a.cond()){unlockedAch.push(a.id);newly.push(a);}
  });
  newly.forEach((a,i)=>setTimeout(()=>showLvlBanner('🏆 '+a.name),900+i*2000));
}

function persistPlayer(){
  const data={hi,ach:unlockedAch};
  if(player){player.setData(data,true).catch(()=>{});}
  else{try{localStorage.setItem('bagrunner_data',JSON.stringify(data));}catch(e){}}
}
function loadPlayerLocal(){
  try{
    const raw=localStorage.getItem('bagrunner_data');
    if(raw){const d=JSON.parse(raw);hi=d.hi||0;unlockedAch=d.ach||[];}
  }catch(e){}
}

function maybeSuggestShortcut(){
  if(!ysdk||!ysdk.shortcut||!ysdk.shortcut.canShowPrompt)return;
  ysdk.shortcut.canShowPrompt().then(({canShow})=>{
    if(canShow)ysdk.shortcut.showPrompt().catch(()=>{});
  }).catch(()=>{});
}

function endGame(){
  state='dead';cancelAnimationFrame(animId);
  stopMusic();
  if(score>hi)hi=score;
  checkAchievements();
  persistPlayer();
  if(ysdk&&score>0){
    ysdk.getLeaderboards().then(lb=>lb.setLeaderboardScore('bagrunner_score',score)).catch(()=>{});
  }
  ysdk?.features?.GameplayAPI?.stop();
  const med=score>=500?'🥇':score>=200?'🥈':score>=80?'🥉':'💀';
  document.getElementById('oEmoji').textContent=med;
  document.getElementById('oTitle').textContent=score>=300?'ВОТ ЭТО ДА!':score>=100?'НЕПЛОХО!':'ЕЩЁ РАЗ!';
  document.getElementById('oSub').innerHTML=`СЧЁТ: <b style="color:#FFD700">${String(score).padStart(5,'0')}</b><br>РЕКОРД: <b style="color:#FFD700">${String(hi).padStart(5,'0')}</b><br><span style="color:#666">уровень: ${LEVELS[curLvl].name}</span>`;
  document.getElementById('oBtn').textContent='► ЕЩЁ РАЗ';
  document.getElementById('overlay').style.display='flex';

  roundsPlayed++;
  if(roundsPlayed===2)maybeSuggestShortcut();
  if(ysdk&&roundsPlayed%3===0){
    ysdk.adv.showFullscreenAdv({callbacks:{onClose:function(){},onError:function(){}}});
  }
}

// --- пауза ---
function pauseGame(){
  if(state!=='playing')return;
  state='paused';
  cancelAnimationFrame(animId);
  stopMusic();
  ysdk?.features?.GameplayAPI?.stop();
  try{ysdk?.adv?.showBannerAdv();}catch(e){}
  document.getElementById('pauseOverlay').style.display='flex';
}
function resumeGame(){
  if(state!=='paused')return;
  state='playing';
  try{ysdk?.adv?.hideBannerAdv();}catch(e){}
  document.getElementById('pauseOverlay').style.display='none';
  ysdk?.features?.GameplayAPI?.start();
  startMusic();
  gameLoop();
}
function togglePause(){
  if(state==='playing')pauseGame();
  else if(state==='paused')resumeGame();
}
function toggleMute(){
  musicOn=!musicOn;
  document.getElementById('muteBtn').textContent=musicOn?'🔊 Звук: Вкл':'🔇 Звук: Выкл';
  if(musicOn&&state==='playing')startMusic();else stopMusic();
}

// --- щит за рекламу ---
function requestShield(){
  if(shieldTime>0)return;
  const btn=document.getElementById('adShieldBtn');
  if(ysdk&&ysdk.adv&&ysdk.adv.showRewardedVideo){
    ysdk.adv.showRewardedVideo({callbacks:{
      onRewarded:function(){shieldTime=600;btn.disabled=true;},
      onClose:function(){},onError:function(){}
    }});
  } else {
    shieldTime=600;btn.disabled=true;
  }
}

// --- реванш за рекламу ---
function showReviveOffer(){
  state='revive';
  cancelAnimationFrame(animId);
  stopMusic();
  document.getElementById('reviveOverlay').style.display='flex';
}
function declineRevive(){
  document.getElementById('reviveOverlay').style.display='none';
  endGame();
}
function acceptRevive(){
  if(ysdk&&ysdk.adv&&ysdk.adv.showRewardedVideo){
    ysdk.adv.showRewardedVideo({callbacks:{
      onRewarded:function(){doRevive();},
      onClose:function(){},onError:function(){}
    }});
  } else {
    doRevive();
  }
}
function doRevive(){
  reviveUsed=true;lives=1;updateHUD();
  document.getElementById('reviveOverlay').style.display='none';
  state='playing';
  startMusic();
  gameLoop();
}

// --- таблица лидеров ---
function openLeaderboard(){
  document.getElementById('lbList').textContent='Загрузка...';
  document.getElementById('lbOverlay').style.display='flex';
  if(!ysdk){document.getElementById('lbList').textContent='Доступно только в Яндекс Играх';return;}
  ysdk.getLeaderboards().then(lb=>lb.getLeaderboardEntries('bagrunner_score',{quantityTop:10,includeUser:true}))
  .then(res=>{
    const rows=(res.entries||[]).map((e,i)=>`${i+1}. ${(e.player&&e.player.publicName)||'Игрок'} — ${e.score}`);
    document.getElementById('lbList').innerHTML=rows.join('<br>')||'Пока пусто';
  })
  .catch(()=>{document.getElementById('lbList').textContent='Рейтинг недоступен — создайте лидерборд с тех. именем bagrunner_score в кабинете разработчика';});
}
function closeLeaderboard(){document.getElementById('lbOverlay').style.display='none';}

const GC=document.getElementById('gc');
function getRelX(cx){const r=GC.getBoundingClientRect();return(cx-r.left)*(W/r.width)-BW/2;}
GC.addEventListener('mousemove',e=>{if(state==='playing')targetX=getRelX(e.clientX);});
GC.addEventListener('touchmove',e=>{if(state!=='playing')return;e.preventDefault();targetX=getRelX(e.touches[0].clientX);},{passive:false});
GC.addEventListener('click',initAudio);
document.getElementById('oBtn').addEventListener('click',startGame);
document.getElementById('resumeBtn').addEventListener('click',resumeGame);
document.getElementById('adShieldBtn').addEventListener('click',requestShield);
document.getElementById('muteBtn').addEventListener('click',toggleMute);
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('reviveBtn').addEventListener('click',acceptRevive);
document.getElementById('declineBtn').addEventListener('click',declineRevive);
document.getElementById('lbBtn').addEventListener('click',openLeaderboard);
document.getElementById('lbCloseBtn').addEventListener('click',closeLeaderboard);

window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keyLeft=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keyRight=true;
  if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();togglePause();}
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state==='playing'||state==='paused')togglePause();
    else if(state==='idle'||state==='dead')startGame();
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keyLeft=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keyRight=false;
});

// --- адаптация под экран ---
function fitStage(){
  const scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  GC.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',()=>setTimeout(fitStage,100));
fitStage();

// --- Яндекс Игры SDK ---
let ysdk=null,player=null,roundsPlayed=0;

if(typeof YaGames!=='undefined'){
  YaGames.init().then(sdk=>{
    ysdk=sdk;
    ysdk.features?.LoadingAPI?.ready();
    sdk.getPlayer({scopes:false}).then(p=>{
      player=p;
      player.getData(['hi','ach']).then(d=>{
        if(d&&d.hi)hi=d.hi;
        if(d&&d.ach)unlockedAch=d.ach;
      }).catch(()=>{loadPlayerLocal();});
    }).catch(()=>{loadPlayerLocal();});
  }).catch(()=>{loadPlayerLocal();});
} else {
  loadPlayerLocal();
}

drawBg(0);drawPixelBag(W/2,BAG_Y,0,'😐');updateHUD();
</script>
